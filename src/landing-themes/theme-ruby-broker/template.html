<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{{seo_title}}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="theme-ruby">
<header class="ruby-header"><div class="ruby-container">
  <div class="ruby-logo">{{brand_name}}</div>
  <a href="#bewerbung-form" class="ruby-cta-btn">{{hero_cta}}</a>
</div></header>

<section class="ruby-hero">
  <div class="ruby-container">
    <h1>{{hero_title}}</h1>
    <p>{{hero_sub}}</p>
    <div class="ruby-hero-img"><img src="{{hero_image}}" /></div>
  </div>
</section>

<section class="ruby-trust"><div class="ruby-container">
  <div class="ruby-trust-row">
    <div><span>✓</span> {{t1_t}}</div>
    <div><span>✓</span> {{t2_t}}</div>
    <div><span>✓</span> {{t3_t}}</div>
  </div>
</div></section>

<section id="prozess" class="ruby-steps"><div class="ruby-container">
  <h2>{{process_title}}</h2>
  <div class="ruby-step-grid">
    <div class="ruby-step"><h3>{{s1_t}}</h3><p>{{s1_d}}</p></div>
    <div class="ruby-step"><h3>{{s2_t}}</h3><p>{{s2_d}}</p></div>
    <div class="ruby-step"><h3>{{s3_t}}</h3><p>{{s3_d}}</p></div>
  </div>
</div></section>

<footer class="ruby-footer"><div class="ruby-container">
  <div class="ruby-footer-top">
    <div><h4>{{firmenname}}</h4><p>{{contact_address}}</p></div>
    <div class="ruby-footer-legal">{{legal_block}}</div>
  </div>
</div></footer>
<script src="script.js"></script>
</body>
</html>
