<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{{seo_title}}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="theme-slate">
<div class="slate-bg-overlay"></div>
<header class="slate-header"><div class="slate-container">
  <a href="#" class="slate-logo">{{brand_name}}</a>
  <a href="#bewerbung-form" class="slate-btn-outline">{{hero_cta}}</a>
</div></header>

<section class="slate-hero"><div class="slate-container">
  <div class="slate-hero-box">
    <span>Exklusiv & Professionell</span>
    <h1>{{hero_title}}</h1>
    <p>{{hero_sub}}</p>
    <a href="#bewerbung-form" class="slate-btn-solid">Beratungsgespräch anfragen</a>
  </div>
</div></section>

<section id="prozess" class="slate-process"><div class="slate-container">
  <div class="slate-process-grid">
    <div class="slate-process-intro">
      <h2>{{process_title}}</h2>
      <p>Qualität braucht Zeit und Diskretion.</p>
    </div>
    <div class="slate-process-items">
      <div class="slate-item"><h5>{{s1_t}}</h5><p>{{s1_d}}</p></div>
      <div class="slate-item"><h5>{{s2_t}}</h5><p>{{s2_d}}</p></div>
      <div class="slate-item"><h5>{{s3_t}}</h5><p>{{s3_d}}</p></div>
    </div>
  </div>
</div></section>

<footer class="slate-footer"><div class="slate-container">
  <div class="slate-footer-inner">
    <div class="slate-footer-brand">
      <h3>{{firmenname}}</h3>
      <div class="slate-contact">{{contact_address}}<br/>{{contact_phone}}</div>
    </div>
    <div class="slate-footer-nav">{{legal_block}}</div>
  </div>
</div></footer>
<script src="script.js"></script>
</body>
</html>
